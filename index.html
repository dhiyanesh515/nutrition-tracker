<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nutrition Tracker</title><link rel="manifest" href="manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{color-scheme:dark;--bg:#090a0d;--panel:#17191f;--panel2:#20232b;--line:#2b2e37;--muted:#9298a6;--white:#f6f7fb;--green:#a7e36d;--orange:#ffb45e;--blue:#66c9ff;--pink:#ff6f91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1180px;margin:auto;padding:22px 22px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:22px;font-weight:750;letter-spacing:-.5px}.date{color:var(--muted);font-size:13px;margin-top:4px}
.layout{display:grid;grid-template-columns:205px 1fr;gap:24px}.nav{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;height:max-content;position:sticky;top:15px}.nav button,.mobile-nav button{width:100%;border:0;background:transparent;color:#aeb3bf;text-align:left;padding:12px;border-radius:12px;margin:2px 0;font-size:14px;cursor:pointer}.nav button.active,.mobile-nav button.active{background:#2a2e37;color:white}.nav button span{display:inline-block;width:25px}.content h1{font-size:26px;margin:0 0 5px;letter-spacing:-.6px}.sub{color:var(--muted);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;min-width:0}.label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:750;margin:7px 0 3px}.unit{font-size:12px;color:var(--muted)}.track{height:7px;background:#30343e;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;border-radius:20px;background:var(--green);width:0}.section{margin-top:16px}.section-title{font-size:16px;font-weight:700;margin:0 0 12px}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.ring-wrap{display:flex;align-items:center;gap:22px}.ring{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--p,0%),#30343e 0);position:relative;flex:none}.ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}.ring>div{z-index:1;text-align:center}.ring strong{display:block;font-size:24px}.ring small{color:var(--muted)}.water{background:linear-gradient(135deg,#142d3a,#17202a)}.water .fill{background:var(--blue)}.consistency{display:grid;grid-template-columns:repeat(15,1fr);gap:6px}.dot{aspect-ratio:1;border-radius:50%;background:#343841}.dot.done{background:#a7e36d}.dot.mid{background:#e6b85d}.dot.low{background:#e4775f}.meal{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}.meal:last-child{border:0}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--green);color:#11170c;font-weight:700;cursor:pointer}.btn.secondary{background:#2b303a;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input,select{background:#242832;color:white;border:1px solid #3a3e49;border-radius:10px;padding:11px;min-width:0;width:100%;margin:5px 0 10px}label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:500}.hidden{display:none!important}.mobile-nav{display:none}.empty{padding:20px;text-align:center;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sync-status{font-size:11px;color:var(--muted);text-align:right;max-width:180px}
@media(max-width:760px){.top{align-items:flex-start;gap:8px}.top-actions{gap:6px}.top-actions .btn{padding:9px 10px;font-size:12px}.sync-status{max-width:110px}}
@media(max-width:760px){.app{padding:18px 14px 95px}.layout{display:block}.nav{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:14px;border-radius:16px}.value{font-size:22px}.two{grid-template-columns:1fr}.content h1{font-size:24px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111318;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;z-index:10}.mobile-nav button{width:auto;text-align:center;font-size:10px;padding:8px 5px;margin:0}.mobile-nav button span{display:block;font-size:17px;margin-bottom:3px}.consistency{grid-template-columns:repeat(10,1fr);gap:7px}.ring{width:125px;height:125px}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="brand">◉ Nutrition Tracker</div><div class="date" id="today"></div></div><div class="top-actions"><div class="sync-status" id="syncStatus">Local only · not connected</div><button class="btn" id="googleBtn" onclick="connectGoogle()">Connect Google</button><button class="btn secondary" onclick="showPage('settings')">⚙ Settings</button></div></header>
<div class="layout"><aside class="nav" id="side"></aside><main class="content" id="content"></main></div></div>
<nav class="mobile-nav" id="mobile"></nav>
<script>
const pages=[['dashboard','⌂','Overview'],['monthly','▦','Monthly'],['diary','＋','Food diary'],['foods','◫','Food library'],['analytics','◒','Analytics'],['weight','↗','Weight'],['assistant','✦','Assistant'],['settings','⚙','Settings']];
let db=JSON.parse(localStorage.getItem('nt_db')||'null')||{targets:{cal:2500,protein:100,carbs:300,fat:75,water:2500},foods:[],entries:{},weights:[]};
const today=()=>new Date().toISOString().slice(0,10); const key=today();
function save(){localStorage.setItem('nt_db',JSON.stringify(db));scheduleCloudSave()}
function entries(){return db.entries[key]||[]}
function totals(){return entries().reduce((a,e)=>{for(let k of ['cal','protein','carbs','fat','fibre','creatine'])a[k]=(a[k]||0)+(+e[k]||0);return a},{})}
function pct(v,t){return Math.min(100,Math.round((v/(t||1))*100))}
function nav(){let html=pages.map(p=>`<button data-page="${p[0]}" onclick="showPage('${p[0]}')"><span>${p[1]}</span>${p[2]}</button>`).join('');document.getElementById('side').innerHTML=html;document.getElementById('mobile').innerHTML=pages.slice(0,5).map(p=>`<button data-page="${p[0]}" onclick="showPage('${p[0]}')"><span>${p[1]}</span>${p[2]}</button>`).join('')}
function head(title,sub){return `<h1>${title}</h1><div class="sub">${sub||''}</div>`}
function metric(name,val,target,unit,color){return `<div class="card"><div class="label">${name}</div><div class="value">${(+val||0).toFixed(name==='Calories'?0:1)} <span class="unit">${unit}</span></div><div class="label">of ${target} ${unit}</div><div class="track"><div class="fill" style="width:${pct(val,target)}%;background:${color}"></div></div></div>`}
function dashboard(){let t=totals(),tg=db.targets;let w=+(db.water?.[key]||0);return head('Good day 👋','Your daily nutrition at a glance')+`<div class="grid">${metric('Calories',t.cal,tg.cal,'kcal','#a7e36d')}${metric('Protein',t.protein,tg.protein,'g','#ffb45e')}${metric('Carbs',t.carbs,tg.carbs,'g','#66c9ff')}${metric('Fat',t.fat,tg.fat,'g','#ff6f91')}</div><div class="two section"><div class="card"><div class="section-title">Daily calorie progress</div><div class="ring-wrap"><div class="ring" style="--p:${pct(t.cal,tg.cal)}%"><div><strong>${pct(t.cal,tg.cal)}%</strong><small>complete</small></div></div><div><div class="value">${Math.round(t.cal)} <span class="unit">kcal</span></div><div class="muted">of ${tg.cal} kcal target</div><div class="muted" style="margin-top:9px">${Math.max(0,tg.cal-Math.round(t.cal))} kcal remaining</div></div></div></div><div class="card water"><div class="section-title">💧 Water intake</div><div class="value">${w} <span class="unit">/ ${tg.water} ml</span></div><div class="track"><div class="fill" style="width:${pct(w,tg.water)}%"></div></div><div class="actions"><button class="btn" onclick="addWater(250)">+250 ml</button><button class="btn secondary" onclick="addWater(500)">+500 ml</button></div></div></div><div class="card section"><div class="section-title">Monthly consistency · Last 30 days</div><div class="consistency">${Array.from({length:30},(_,i)=>`<i class="dot ${i<Math.min(30,Object.keys(db.entries).length)?'done':''}"></i>`).join('')}</div><div class="label" style="margin-top:12px">Daily target completion overview · Detailed calendar in Monthly</div><div class="actions"><button class="btn secondary" onclick="showPage('monthly')">Open monthly tracker →</button></div></div><div class="card section"><div class="section-title">Today's food</div>${entries().length?entries().map(e=>`<div class="meal"><span>${e.name}</span><span>${e.cal||0} kcal</span></div>`).join(''):'<div class="empty">No meals logged yet. Add your first food entry.</div>'}<div class="actions"><button class="btn" onclick="showPage('diary')">＋ Add food</button></div></div>`}
function diary(){return head('Food diary','Log meals and nutrients for today')+`<div class="card"><form id="foodform"><div class="formgrid"><div><label>Food / product name</label><input name="name" required placeholder="e.g. Muesli"></div><div><label>Meal</label><select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div>${[['cal','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)'],['fibre','Fibre (g)'],['creatine','Creatine (g)']].map(x=>`<div><label>${x[1]}</label><input name="${x[0]}" type="number" min="0" step="0.1" value="0"></div>`).join('')}</div><button class="btn">Save food entry</button></form></div><div class="card section"><div class="section-title">Today's entries</div>${entries().map((e,i)=>`<div class="meal"><div><b>${e.name}</b><div class="muted">${e.meal} · P ${e.protein}g · C ${e.carbs}g · F ${e.fat}g</div></div><div>${e.cal} kcal <button class="btn secondary" onclick="removeEntry(${i})">×</button></div></div>`).join('')||'<div class="empty">Nothing logged yet.</div>'}</div>`}
function monthly(){let y=new Date().getFullYear(),m=new Date().getMonth(),days=new Date(y,m+1,0).getDate();return head('Monthly tracker','Your daily consistency calendar')+`<div class="card"><div class="section-title">${new Date(y,m).toLocaleString('en',{month:'long',year:'numeric'})}</div><div class="consistency" style="grid-template-columns:repeat(7,1fr)">${Array.from({length:days},(_,i)=>{let d=String(i+1).padStart(2,'0'),k=`${y}-${String(m+1).padStart(2,'0')}-${d}`,n=(db.entries[k]||[]).reduce((a,e)=>a+(+e.cal||0),0),done=n>=db.targets.cal;return `<div style="text-align:center"><i class="dot ${done?'done':n?'mid':''}" style="display:block"></i><small class="muted">${i+1}</small></div>`}).join('')}</div></div><div class="card section"><div class="section-title">Monthly averages</div><p class="muted">Daily averages will appear as you log meals throughout the month.</p></div>`}
function foods(){return head('Food library','Save reusable products and nutrition values')+`<div class="card"><form id="libform"><label>Product name</label><input name="name" required placeholder="Product name"><label>Product code</label><input name="code" placeholder="e.g. 001"><div class="formgrid">${[['cal','Calories kcal'],['protein','Protein g'],['carbs','Carbs g'],['fat','Fat g'],['fibre','Fibre g'],['creatine','Creatine g']].map(x=>`<div><label>${x[1]}</label><input name="${x[0]}" type="number" step=".1" value="0"></div>`).join('')}</div><button class="btn">Save product</button></form></div><div class="card section">${db.foods.map(f=>`<div class="meal"><span><b>${f.name}</b><div class="muted">Code ${f.code||'—'} · ${f.cal} kcal · P ${f.protein}g</div></span></div>`).join('')||'<div class="empty">Your product library is empty.</div>'}</div>`}
function analytics(){let t=totals();return head('Analytics','Understand your nutrition patterns')+`<div class="grid">${metric('Calories',t.cal,db.targets.cal,'kcal','#a7e36d')}${metric('Protein',t.protein,db.targets.protein,'g','#ffb45e')}${metric('Carbs',t.carbs,db.targets.carbs,'g','#66c9ff')}${metric('Fat',t.fat,db.targets.fat,'g','#ff6f91')}</div><div class="card section"><div class="section-title">Today's nutrient breakdown</div><p class="muted">Log meals to build your daily and monthly trends.</p></div>`}
function weight(){return head('Weight tracker','Record your body weight weekly')+`<div class="card"><form id="weightform"><label>Weight (kg)</label><input name="kg" type="number" min="1" step=".1" required placeholder="e.g. 46.0"><label>Date</label><input name="date" type="date" value="${key}"><button class="btn">Save weight</button></form></div><div class="card section"><div class="section-title">Weight history</div>${db.weights.slice().reverse().map(w=>`<div class="meal"><span>${w.date}</span><b>${w.kg} kg</b></div>`).join('')||'<div class="empty">No weight records yet.</div>'}</div>`}
function assistant(){return head('Nutrition assistant','A separate space for nutrition questions')+`<div class="card"><p class="muted">This is a placeholder for the future ChatGPT-powered assistant. It is not connected yet.</p><label>Your question</label><input id="question" placeholder="Ask about your food or nutrition..."><button class="btn" onclick="alert('Assistant connection will be added in a later version.')">Ask assistant</button></div>`}
function settings(){return head('Settings','Set your daily nutrition targets')+`<div class="card"><form id="settingsform">${[['cal','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)'],['water','Water (ml)']].map(x=>`<label>${x[1]}</label><input name="${x[0]}" type="number" min="1" value="${db.targets[x[0]]}">`).join('')}<button class="btn">Save targets</button></form></div><div class="card section"><div class="section-title">Your data</div><p class="muted">Your entries are saved on this device. Connect Google above to sync with your private Google Sheets database. Offline changes stay local until you reconnect.</p><button class="btn secondary" onclick="exportData()">Export backup (JSON)</button><div class="actions"><button class="btn secondary" onclick="connectGoogle()">Connect / sync Google Sheets</button></div><p class="muted" id="settingsSyncStatus">Google Sheets is not connected.</p></div>`}
function showPage(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let views={dashboard,diary,monthly,foods,analytics,weight,assistant,settings};document.getElementById('content').innerHTML=views[p]();bindForms()}
function bindForms(){let f=document.getElementById('foodform');if(f)f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));db.entries[key]=entries().concat(o);save();showPage('diary')};let l=document.getElementById('libform');if(l)l.onsubmit=e=>{e.preventDefault();db.foods.push(Object.fromEntries(new FormData(l)));save();showPage('foods')};let w=document.getElementById('weightform');if(w)w.onsubmit=e=>{e.preventDefault();db.weights.push(Object.fromEntries(new FormData(w)));save();showPage('weight')};let s=document.getElementById('settingsform');if(s)s.onsubmit=e=>{e.preventDefault();db.targets=Object.fromEntries(new FormData(s));save();showPage('settings')}}
function addWater(n){db.water=db.water||{};db.water[key]=(db.water[key]||0)+n;save();showPage('dashboard')}
function removeEntry(i){db.entries[key].splice(i,1);save();showPage('diary')}
function exportData(){let a=document.createElement('a'),b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='nutrition-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)}

// Google Sheets cloud sync. The OAuth access token is kept only in memory.
const GOOGLE_CLIENT_ID='611294920775-soli64k777tk6vrr783sf3vipjpgn7lt.apps.googleusercontent.com';
const SPREADSHEET_ID='1ywaVGqWAW-ULzJL2B9gVcpfnwiOARzylGLzYAtyr9n8';
const SHEETS_SCOPE='https://www.googleapis.com/auth/spreadsheets';
let googleToken='',tokenClient=null,syncTimer=null,isLoadingCloud=false,silentAuthAttempt=false;
const sheetNames=['Food_Diary','Food_Library','Water_Tracker','Weight_Tracker','Settings'];
function syncMessage(msg){let a=document.getElementById('syncStatus');if(a)a.textContent=msg;let b=document.getElementById('settingsSyncStatus');if(b)b.textContent=msg}
function initGoogleAuth(){
  if(!window.google?.accounts?.oauth2) return false;
  if(!tokenClient) tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,scope:SHEETS_SCOPE,
    callback:async(resp)=>{if(resp.error){googleToken='';syncMessage('Google not connected · tap Connect Google');if(!silentAuthAttempt)alert('Google sign-in failed: '+resp.error);silentAuthAttempt=false;return}
      silentAuthAttempt=false;googleToken=resp.access_token;localStorage.setItem('nt_google_authorized','1');document.getElementById('googleBtn').textContent='Google connected';
      syncMessage('Connecting to your spreadsheet…');
      try{await loadCloudDatabase();syncMessage('Synced with Google Sheets');showPage(currentPage);}
      catch(err){console.error(err);syncMessage('Sync error · local data kept');alert('Could not sync with Google Sheets. '+err.message)}
    }
  });
  return true;
}
function connectGoogle(){
  if(!initGoogleAuth()){alert('Google sign-in is still loading. Wait a few seconds and try again.');return}
  const previouslyAuthorized=localStorage.getItem('nt_google_authorized')==='1';
  tokenClient.requestAccessToken({prompt:previouslyAuthorized?'select_account':'consent'});
}
function restoreGoogleSession(){
  if(!initGoogleAuth()){setTimeout(restoreGoogleSession,400);return}
  if(localStorage.getItem('nt_google_authorized')!=='1'){
    syncMessage('Tap Connect Google to authorize');
    return;
  }
  silentAuthAttempt=true;
  tokenClient.requestAccessToken({prompt:''});
}
async function sheetsRequest(path,options={}){
  if(!googleToken)throw new Error('Google account is not connected');
  const response=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/'+path,{
    ...options,headers:{'Authorization':'Bearer '+googleToken,'Content-Type':'application/json',...(options.headers||{})}
  });
  const data=await response.json();
  if(!response.ok){if(response.status===401){googleToken='';syncMessage('Google session expired · reconnect')}throw new Error(data.error?.message||('Sheets API error '+response.status))}
  return data;
}
const num=v=>Number(v)||0;
async function loadCloudDatabase(){
  const ranges=sheetNames.map(n=>encodeURIComponent(n+'!A:Z')).join('&ranges=');
  const result=await sheetsRequest('values:batchGet?ranges='+ranges);
  const byName={};(result.valueRanges||[]).forEach((v,i)=>byName[sheetNames[i]]=v.values||[]);
  const diary=byName.Food_Diary||[],library=byName.Food_Library||[],waterRows=byName.Water_Tracker||[],weightRows=byName.Weight_Tracker||[],settingsRows=byName.Settings||[];
  const remote={targets:{cal:2500,protein:100,carbs:300,fat:75,water:2500},foods:[],entries:{},weights:[],water:{}};
  let hasData=false;
  diary.slice(1).forEach(r=>{if(!r[1]||!r[5])return;hasData=true;const date=r[1],e={name:r[5],meal:r[3]||'Snack',cal:num(r[6]),protein:num(r[7]),carbs:num(r[8]),fat:num(r[9]),fibre:num(r[10]),creatine:num(r[11])};(remote.entries[date]??=[]).push(e)});
  library.slice(1).forEach(r=>{if(!r[1])return;hasData=true;remote.foods.push({code:r[0]||'',name:r[1],cal:num(r[2]),protein:num(r[3]),carbs:num(r[4]),fat:num(r[5]),fibre:num(r[6]),creatine:num(r[7])})});
  waterRows.slice(1).forEach(r=>{if(!r[0])return;hasData=true;remote.water[r[0]]=(remote.water[r[0]]||0)+num(r[2])});
  weightRows.slice(1).forEach(r=>{if(!r[0])return;hasData=true;remote.weights.push({date:r[0],kg:num(r[1])})});
  settingsRows.slice(1).forEach(r=>{if(r[0]==='targets_json'&&r[1]){try{remote.targets={...remote.targets,...JSON.parse(r[1])};hasData=true}catch(e){}}});
  if(hasData){db=remote;localStorage.setItem('nt_db',JSON.stringify(db));}
  else {await pushCloudDatabase();localStorage.setItem('nt_db',JSON.stringify(db));}
}
async function pushCloudDatabase(){
  const diary=[['Entry_ID','Date','Time','Meal','Product_Code','Food_Name','Calories','Protein_g','Carbs_g','Fat_g','Fibre_g','Creatine_g']];
  Object.entries(db.entries||{}).forEach(([date,list])=>(list||[]).forEach((e,i)=>diary.push([date+'-'+i,date,'',e.meal||'Snack','',e.name||'',num(e.cal),num(e.protein),num(e.carbs),num(e.fat),num(e.fibre),num(e.creatine)])));
  const library=[['Product_Code','Product_Name','Calories','Protein_g','Carbs_g','Fat_g','Fibre_g','Creatine_g'],...(db.foods||[]).map(f=>[f.code||'',f.name||'',num(f.cal),num(f.protein),num(f.carbs),num(f.fat),num(f.fibre),num(f.creatine)])];
  const water=[['Date','Time','Amount_ml','Entry_ID'],...Object.entries(db.water||{}).map(([date,amount])=>[date,'',num(amount),date+'-total'])];
  const weights=[['Date','Weight_kg','Entry_ID'],...(db.weights||[]).map((w,i)=>[w.date,num(w.kg),w.date+'-'+i])];
  const settings=[['Setting','Value'],['targets_json',JSON.stringify(db.targets||{})]];
  const data=[['Food_Diary!A1',diary],['Food_Library!A1',library],['Water_Tracker!A1',water],['Weight_Tracker!A1',weights],['Settings!A1',settings]].map(([range,values])=>({range,values}));
  await sheetsRequest('values:batchClear',{method:'POST',body:JSON.stringify({ranges:sheetNames.map(n=>n+'!A:Z')})});
  await sheetsRequest('values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})});
}
function scheduleCloudSave(){
  if(!googleToken||isLoadingCloud)return;
  clearTimeout(syncTimer);syncMessage('Saving to Google Sheets…');
  syncTimer=setTimeout(async()=>{try{await pushCloudDatabase();syncMessage('All changes synced ✓')}catch(err){console.error(err);syncMessage('Offline / sync pending · local data kept')}},900);
}
let currentPage='dashboard';

document.getElementById('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});nav();showPage('dashboard');
window.addEventListener('load',()=>{restoreGoogleSession();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')});
</script></body></html>
